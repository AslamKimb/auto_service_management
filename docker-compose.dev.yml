services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - ./bench-data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -padmin --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./bench-data/redis-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./bench-data/redis-queue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis-socketio:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./bench-data/redis-socketio:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  setup:
    image: frappe/bench:latest
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -ex
        cd /home/frappe/bench-home

        if [ -f frappe-bench/sites/apps.txt ]; then
          echo "Bench already initialized"
        else
          echo "=== Initializing bench ==="
          bench init --frappe-branch version-16 --python python3 --skip-redis-config-generation frappe-bench
        fi

        cd frappe-bench

        ensure_apps_txt_entry() {
          app_name="$$1"
          grep -qx "$$app_name" sites/apps.txt 2>/dev/null || printf '%s\n' "$$app_name" >> sites/apps.txt
        }

        pin_app() {
          app_name="$$1"
          app_commit="$$2"
          app_branch="$$3"
          app_url="$$4"
          app_path="apps/$$app_name"
          test -d "$$app_path/.git"
          echo "=== Pinning $$app_name to $$app_commit ==="
          if [ "$(git -C "$$app_path" rev-parse HEAD)" != "$$app_commit" ]; then
            # bench init creates shallow app clones. Fetch the exact pinned
            # commit so checkout does not depend on the branch tip's history.
            git -C "$$app_path" fetch --no-tags "$$app_url" "$$app_commit"
            git -C "$$app_path" checkout --detach "$$app_commit"
          fi
          test "$(git -C "$$app_path" rev-parse HEAD)" = "$$app_commit"
        }

        get_remote_app() {
          app_name="$$1"
          app_url="$$2"
          app_branch="$$3"
          app_commit="$$4"
          if [ -d "apps/$$app_name" ]; then
            echo "=== $$app_name already present ==="
          else
            echo "=== Getting $$app_name ==="
            bench get-app "$$app_url" --branch "$$app_branch"
          fi
          pin_app "$$app_name" "$$app_commit" "$$app_branch" "$$app_url"
          ensure_apps_txt_entry "$$app_name"
        }

        install_local_auto_service() {
          source_dir="/app-source"
          dest_dir="apps/auto_service_management"
          tmp_dir="apps/.auto_service_management.sync"
          echo "=== Syncing auto_service_management source ==="
          test -f "$$source_dir/auto_service_management/__init__.py"
          rm -rf "$$tmp_dir"
          # Do not preserve root ownership from the Windows bind mount. The
          # bench runtime and future setup runs execute as the `frappe` user.
          cp -r "$$source_dir" "$$tmp_dir"
          test -f "$$tmp_dir/auto_service_management/__init__.py"
          rm -rf "$$dest_dir"
          mv "$$tmp_dir" "$$dest_dir"
          echo "=== Editable install for Python 3.14 compatibility ==="
          # The app is a PEP 517/660 Flit project, while the base bench image
          # does not ship flit_core. Install the tiny build backend explicitly
          # and disable build isolation so setup cannot download a duplicate
          # toolchain into the nearly-full editable bench volume.
          env/bin/pip install --no-cache-dir "flit_core>=3.4,<4"
          env/bin/pip install -e apps/auto_service_management --no-deps --no-build-isolation
          ensure_apps_txt_entry auto_service_management
          test -f apps/auto_service_management/auto_service_management/__init__.py
        }

        ensure_site() {
          site_name="$$1"
          if [ -d "sites/$$site_name" ]; then
            echo "=== $$site_name already exists ==="
          else
            echo "=== Creating $$site_name ==="
            if [ "$$site_name" = "auto-service.localhost" ]; then
              bench new-site "$$site_name" \
                --mariadb-root-password admin \
                --mariadb-user-host-login-scope=% \
                --admin-password admin \
                --set-default
            else
              bench new-site "$$site_name" \
                --mariadb-root-password admin \
                --mariadb-user-host-login-scope=% \
                --admin-password admin
            fi
          fi
        }

        ensure_site_app() {
          site_name="$$1"
          app_name="$$2"
          if bench --site "$$site_name" list-apps | grep -qx "$$app_name"; then
            echo "=== $$app_name already installed on $$site_name ==="
          else
            echo "=== Installing $$app_name on $$site_name ==="
            bench --site "$$site_name" install-app "$$app_name"
          fi
        }

        pin_app frappe 6a329d068416768ec47ccd3326b9cc95a8d7bf99 version-16 https://github.com/frappe/frappe
        get_remote_app erpnext https://github.com/frappe/erpnext version-16 11e0ba0a1c45f217e2e73e885f699102d06da325
        get_remote_app hrms https://github.com/frappe/hrms version-16 f281e8b172ac8836ad89c59df65a922101103097
        get_remote_app uganda_compliance https://github.com/erpchampions/uganda_compliance hotfix-v-16 33743cd596c6e8c079945478d0e5b52e461fe770
        install_local_auto_service

        echo "=== Configuring site ==="
        bench set-config -gp redis_cache '"redis://redis-cache:6379"'
        bench set-config -gp redis_queue '"redis://redis-queue:6379"'
        bench set-config -gp redis_socketio '"redis://redis-socketio:6379"'
        bench set-config -gp db_host '"db"'
        bench set-config -gp db_port 3306
        bench set-config -gp socketio_port 9000

        echo "=== Configuring Socket.IO CORS ==="
        bench set-config -gp allow_cors '["http://auto-service.localhost:8080", "http://auto-service.localhost"]'

        ensure_site auto-service.localhost
        ensure_site auto-service-test.localhost

        for site_name in auto-service.localhost auto-service-test.localhost; do
          ensure_site_app "$$site_name" erpnext
          ensure_site_app "$$site_name" auto_service_management
          ensure_site_app "$$site_name" hrms
          ensure_site_app "$$site_name" uganda_compliance
          echo "=== Migrating $$site_name ==="
          bench --site "$$site_name" migrate
        done

        echo "=== Building assets ==="
        bench build --app auto_service_management
        bundle_path=$$(python -c 'import json; print(json.load(open("sites/assets/assets.json"))["repair_job_billing.bundle.js"])')
        bundle_path=$${bundle_path#/assets/}
        test -f "sites/assets/$$bundle_path" || { echo "Missing generated Repair Job billing bundle: sites/assets/$$bundle_path" >&2; exit 1; }
        bench build --app hrms
        bench build --app uganda_compliance

        echo "=== Setup complete ==="
    volumes:
      - ./bench-data/bench-home:/home/frappe/bench-home
      - ./auto_service_management:/app-source:ro
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy

  backend:
    image: frappe/bench:latest
    restart: unless-stopped
    command: ["bench", "serve", "--port", "8000", "--noreload"]
    working_dir: /home/frappe/bench-home/frappe-bench
    volumes:
      - ./bench-data/bench-home:/home/frappe/bench-home
    ports:
      - "8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/method/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./bench-data/bench-home:/home/frappe/bench-home:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Keep 8080 as the documented default, while allowing another local
      # process to coexist via DMS_FRONTEND_PORT (for example, 18081).
      - "${DMS_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    image: frappe/bench:latest
    restart: unless-stopped
    command: ["bench", "schedule"]
    working_dir: /home/frappe/bench-home/frappe-bench
    volumes:
      - ./bench-data/bench-home:/home/frappe/bench-home
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  queue-default:
    image: frappe/bench:latest
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "default"]
    working_dir: /home/frappe/bench-home/frappe-bench
    volumes:
      - ./bench-data/bench-home:/home/frappe/bench-home
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  queue-short:
    image: frappe/bench:latest
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short"]
    working_dir: /home/frappe/bench-home/frappe-bench
    volumes:
      - ./bench-data/bench-home:/home/frappe/bench-home
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  queue-long:
    image: frappe/bench:latest
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long"]
    working_dir: /home/frappe/bench-home/frappe-bench
    volumes:
      - ./bench-data/bench-home:/home/frappe/bench-home
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  websocket:
    image: frappe/bench:latest
    restart: unless-stopped
    command: ["bench", "socketio"]
    working_dir: /home/frappe/bench-home/frappe-bench
    volumes:
      - ./bench-data/bench-home:/home/frappe/bench-home
    ports:
      - "9000:9000"
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
