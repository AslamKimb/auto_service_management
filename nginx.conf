upstream frappe-backend {
    server backend:8000;
}

upstream frappe-socketio {
    server websocket:9000;
}

server {
    listen 80;
    server_name auto-service.localhost auto-service-test.localhost localhost;

    client_max_body_size 100m;
    proxy_read_timeout 120;
    proxy_send_timeout 120;
    proxy_connect_timeout 120;

    root /home/frappe/bench-home/frappe-bench/sites;
    location ~ ^/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bare /socket.io route (Frappe client dev_server=0)
    location /socket.io {
        proxy_pass http://frappe-socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host backend:8000;
        proxy_set_header Origin http://backend:8000;
        proxy_set_header X-Frappe-Site-Name auto-service.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Sitename-prefixed Socket.IO
    location ~ ^/[^/]+/socket\.io {
        rewrite ^/[^/]+(/socket\.io.*)$ $1 break;
        proxy_pass http://frappe-socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host backend:8000;
        proxy_set_header Origin http://backend:8000;
        proxy_set_header X-Frappe-Site-Name auto-service.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://frappe-backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frame-Options SAMEORIGIN;
        proxy_buffering off;
    }
}
