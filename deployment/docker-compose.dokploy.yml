x-dms-image: &dms-image ${CUSTOM_IMAGE}

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis-socketio:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-socketio-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  assets-sync:
    image: *dms-image
    user: "0:0"
    restart: "no"
    command: ["/usr/local/bin/sync-assets", "/opt/frappe-assets", "/target-assets"]
    volumes:
      - assets:/target-assets

  configurator:
    image: *dms-image
    restart: "no"
    command:
      - bash
      - -lc
      - >
        ls -1 apps > sites/apps.txt &&
        bench set-config -g db_host db &&
        bench set-config -gp db_port 3306 &&
        bench set-config -g redis_cache redis://redis-cache:6379 &&
        bench set-config -g redis_queue redis://redis-queue:6379 &&
        bench set-config -g redis_socketio redis://redis-socketio:6379 &&
        bench set-config -gp socketio_port 9000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      assets-sync:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy

  create-site:
    image: *dms-image
    restart: "no"
    command:
      - bash
      - -lc
      - >
        set -e;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        until grep -qs db_host sites/common_site_config.json; do
          echo "waiting for configurator...";
          sleep 5;
        done;
        if [ -f "sites/${SITE_NAME}/site_config.json" ] && bench --site ${SITE_NAME} list-apps >/dev/null 2>&1; then
          echo "site ${SITE_NAME} already exists; skipping bench new-site";
        elif [ -f "sites/${SITE_NAME}/site_config.json" ]; then
          echo "site ${SITE_NAME} has an unusable configuration; set the original DB_ROOT_PASSWORD or remove the fresh deployment volumes" >&2;
          exit 1;
        else
          bench new-site "${SITE_NAME}" --mariadb-root-password "${DB_ROOT_PASSWORD}" --mariadb-user-host-login-scope=% --admin-password "${ADMIN_PASSWORD}" --install-app erpnext --set-default;
        fi
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  install-apps:
    image: *dms-image
    restart: "no"
    command:
      - bash
      - -lc
      - >
        set -e;
        until bench --site ${SITE_NAME} list-apps > /tmp/installed-apps.txt 2>/dev/null; do
          echo "waiting for site to be ready...";
          sleep 10;
        done;
        bench --site ${SITE_NAME} set-config developer_mode 1;
        if ! grep -qx "auto_service_management" /tmp/installed-apps.txt; then
          bench --site ${SITE_NAME} install-app auto_service_management;
        else
          echo "auto_service_management already installed";
        fi;
        bench --site ${SITE_NAME} list-apps > /tmp/installed-apps.txt;
        if ! grep -qx "hrms" /tmp/installed-apps.txt; then
          bench --site ${SITE_NAME} install-app hrms;
        else
          echo "hrms already installed";
        fi;
        bench --site ${SITE_NAME} list-apps > /tmp/installed-apps.txt;
        if ! grep -qx "uganda_compliance" /tmp/installed-apps.txt; then
          bench --site ${SITE_NAME} install-app uganda_compliance;
        else
          echo "uganda_compliance already installed";
        fi;
        bench --site ${SITE_NAME} migrate;
        bench --site ${SITE_NAME} clear-cache
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      create-site:
        condition: service_completed_successfully

  backend:
    image: *dms-image
    restart: unless-stopped
    command:
      - bash
      - -lc
      - >
        set -e;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        wait-for-it -t 120 redis-socketio:6379;
        until grep -qs db_host sites/common_site_config.json; do
          echo "waiting for common_site_config.json...";
          sleep 5;
        done;
        until [ -f "sites/${SITE_NAME}/site_config.json" ]; do
          echo "waiting for site ${SITE_NAME}...";
          sleep 5;
        done;
        exec /home/frappe/frappe-bench/env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites --bind=0.0.0.0:8000 --threads=4 --workers=2 --worker-class=gthread --worker-tmp-dir=/dev/shm --timeout=120 --preload frappe.app:application
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      install-apps:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wait-for-it -t 1 127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  websocket:
    image: *dms-image
    restart: unless-stopped
    command:
      - bash
      - -c
      - >
        set -e;
        wait-for-it -t 120 redis-socketio:6379;
        until grep -qs redis_socketio sites/common_site_config.json; do
          echo "waiting for redis_socketio config...";
          sleep 5;
        done;
        exec /home/frappe/.nvm/versions/node/v24.12.0/bin/node /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      install-apps:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully
      redis-socketio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wait-for-it -t 1 127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  queue-short:
    image: *dms-image
    restart: unless-stopped
    command:
      - bash
      - -lc
      - >
        set -e;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        until grep -qs db_host sites/common_site_config.json; do
          echo "waiting for common_site_config.json...";
          sleep 5;
        done;
        until [ -f "sites/${SITE_NAME}/site_config.json" ]; do
          echo "waiting for site ${SITE_NAME}...";
          sleep 5;
        done;
        exec bench worker --queue short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      install-apps:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  queue-default:
    image: *dms-image
    restart: unless-stopped
    command:
      - bash
      - -lc
      - >
        set -e;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        until grep -qs db_host sites/common_site_config.json; do
          echo "waiting for common_site_config.json...";
          sleep 5;
        done;
        until [ -f "sites/${SITE_NAME}/site_config.json" ]; do
          echo "waiting for site ${SITE_NAME}...";
          sleep 5;
        done;
        exec bench worker --queue default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      install-apps:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  queue-long:
    image: *dms-image
    restart: unless-stopped
    command:
      - bash
      - -lc
      - >
        set -e;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        until grep -qs db_host sites/common_site_config.json; do
          echo "waiting for common_site_config.json...";
          sleep 5;
        done;
        until [ -f "sites/${SITE_NAME}/site_config.json" ]; do
          echo "waiting for site ${SITE_NAME}...";
          sleep 5;
        done;
        exec bench worker --queue long
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      install-apps:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  scheduler:
    image: *dms-image
    restart: unless-stopped
    command:
      - bash
      - -lc
      - >
        set -e;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        until grep -qs db_host sites/common_site_config.json; do
          echo "waiting for common_site_config.json...";
          sleep 5;
        done;
        until [ -f "sites/${SITE_NAME}/site_config.json" ]; do
          echo "waiting for site ${SITE_NAME}...";
          sleep 5;
        done;
        exec bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      install-apps:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  frontend:
    image: *dms-image
    restart: unless-stopped
    command: ["/usr/local/bin/nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      UPSTREAM_WAIT_TIMEOUT: 120
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    expose:
      - "8080"
    networks:
      - default
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  dokploy-network:
    external: true

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  redis-socketio-data:
  sites:
  assets:
