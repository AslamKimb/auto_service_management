name: Frappe App CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frappe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Compile and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auto_service_management
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: auto_service_management/pyproject.toml

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.14.10"

      - name: Compile app
        run: python -m compileall -q auto_service_management

      - name: Discover tests and guard duplicate IDs
        run: python auto_service_management/auto_service_management/tests/quality_gate.py

      - name: Test the quality guard
        run: python -m unittest auto_service_management.auto_service_management.tests.test_phase33_quality_gate -v

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

  frappe-tests:
    name: Frappe v16 app tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare the editable bench bind mount
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-data/bench-home
          # Docker creates a missing bind-mount source as root. The official
          # frappe/bench image runs the setup command as the frappe user.
          chmod -R a+rwX bench-data/bench-home

      - name: Start the editable Frappe v16 stack
        shell: bash
        run: |
          set -euo pipefail
          if ! docker compose -f docker-compose.dev.yml up -d; then
            docker compose -f docker-compose.dev.yml ps -a || true
            docker compose -f docker-compose.dev.yml logs --no-color setup || true
            exit 1
          fi

      - name: Wait for setup to finish
        shell: bash
        run: |
          set -euo pipefail
          setup_id="$(docker compose -f docker-compose.dev.yml ps -q setup)"
          test -n "$setup_id"
          for _ in $(seq 1 300); do
            state="$(docker inspect -f '{{.State.Status}}' "$setup_id")"
            if [[ "$state" == "exited" ]]; then
              break
            fi
            sleep 5
          done
          test "$(docker inspect -f '{{.State.Status}}' "$setup_id")" = "exited"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$setup_id")" = "0"
          for _ in $(seq 1 60); do
            backend_id="$(docker compose -f docker-compose.dev.yml ps -q backend)"
            if [[ -n "$backend_id" ]] && [[ "$(docker inspect -f '{{.State.Health.Status}}' "$backend_id" 2>/dev/null || true)" == "healthy" ]]; then
              break
            fi
            sleep 5
          done
          docker compose -f docker-compose.dev.yml ps

      - name: Run Auto Service Management tests on the test site
        shell: bash
        run: |
          set -euo pipefail
          backend_id="$(docker compose -f docker-compose.dev.yml ps -q backend)"
          test -n "$backend_id"
          test "$(docker inspect -f '{{.State.Health.Status}}' "$backend_id")" = "healthy"
          docker exec "$backend_id" sh -c 'cd /home/frappe/bench-home/frappe-bench/apps/auto_service_management && /home/frappe/bench-home/frappe-bench/env/bin/python auto_service_management/auto_service_management/tests/quality_gate.py'
          docker exec "$backend_id" bench --site auto-service-test.localhost run-tests --app auto_service_management

      - name: Tear down the editable stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down --remove-orphans
